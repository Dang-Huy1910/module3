services:
  kafka-volume-init:
    image: apache/kafka:4.4.0
    user: "0:0"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    restart: "no"

  # ==========================================
  # 1. Apache Kafka KRaft Broker
  # ==========================================
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "4L622nShTUiTwyMV46SwWQ"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 2. Topic Initializer (Idempotent one-shot)
  # ==========================================
  init-topics:
    image: apache/kafka:4.4.0
    container_name: kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        echo 'Initializing Kafka topics...'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic customer-activity-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic lab3-order-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic lab3-activity-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic lab6-order-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic lab6-activity-events --partitions 3 --replication-factor 1
        echo 'Topics ready.'
    restart: "no"

  # ==========================================
  # 3. Hot Path: Analytics Consumer
  # ==========================================
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-analytics
    depends_on:
      kafka:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9108:9108"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ORDER_TOPIC: "order-events"
      KAFKA_ACTIVITY_TOPIC: "customer-activity-events"
      KAFKA_GROUP_ID: "realtime-analytics-v1"
      SQLITE_PATH: "/data/realtime_analytics.db"
      METRICS_PORT: 9108
    volumes:
      - analytics-data:/data
    command: ["python", "-m", "src.analytics.analytics_consumer"]
    restart: on-failure

  # ==========================================
  # 4. Hot Path: Streamlit Dashboard
  # ==========================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-dashboard
    depends_on:
      - analytics
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      SQLITE_PATH: "/data/realtime_analytics.db"
    volumes:
      - analytics-data:/data:ro
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: on-failure

  # ==========================================
  # 5. SeaweedFS (S3-Compatible Object Storage)
  # ==========================================
  object-storage:
    image: chrislusf/seaweedfs:3.79
    container_name: object-storage
    profiles: ["storage"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
    command: "server -dir=/data -s3 -s3.port=8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://object-storage:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # 6. ClickHouse OLAP Data Warehouse
  # ==========================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse
    profiles: ["storage"]
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-analytics-dev}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 7. Raw-event Archiver (Kafka -> S3)
  # ==========================================
  archiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-archiver
    profiles: ["storage"]
    depends_on:
      kafka:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:9109:9109"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      S3_ENDPOINT_URL: "http://object-storage:8333"
      AWS_ACCESS_KEY_ID: "anykey"
      AWS_SECRET_ACCESS_KEY: "anysecret"
      AWS_DEFAULT_REGION: "us-east-1"
      S3_BUCKET_NAME: "ecommerce-raw"
    command: ["python", "-m", "src.archiver.raw_archiver", "--group", "raw-archiver-m6b2-v1", "--topics", "lab6-order-events,lab6-activity-events"]
    restart: on-failure

  # ==========================================
  # 8. Warehouse Loader (S3 -> ClickHouse)
  # ==========================================
  warehouse-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-warehouse-loader
    profiles: ["storage"]
    depends_on:
      - clickhouse
      - object-storage
    environment:
      S3_ENDPOINT_URL: "http://object-storage:8333"
      AWS_ACCESS_KEY_ID: "anykey"
      AWS_SECRET_ACCESS_KEY: "anysecret"
      AWS_DEFAULT_REGION: "us-east-1"
      S3_BUCKET_NAME: "ecommerce-raw"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: "analytics"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-analytics-dev}"
    command: ["python", "-m", "src.warehouse.load_events", "--prefix", "raw/"]

  # ==========================================
  # 9. Monitoring: Prometheus & Grafana & Lag
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: on-failure

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards/pipeline_dashboard.json:/var/lib/grafana/dashboards/pipeline_dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: on-failure

  lag-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-lag-exporter
    profiles: ["monitoring"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:9110:9110"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    command: ["python", "-m", "src.monitoring.lag_exporter", "--bootstrap", "kafka:29092", "--groups", "realtime-analytics-v1"]
    restart: on-failure

  # ==========================================
  # 10. Publisher & Simulators
  # ==========================================
  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-publisher
    depends_on:
      kafka:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    command: ["python", "-m", "src.simulators.publish_fixture", "--file", "fixtures/module6_buoi2_events.jsonl"]

  order-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-order-simulator
    profiles: ["demo"]
    depends_on:
      kafka:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    command: ["python", "-m", "src.simulators.order_generator", "--count", "100", "--rate", "5", "--seed", "42", "--run-id", "docker-demo", "--bootstrap-servers", "kafka:29092"]

volumes:
  kafka-data:
    name: bk_fintech_kafka_data
  analytics-data:
    name: bk_fintech_analytics_data
  storage-data:
    name: bk_fintech_storage_data
  clickhouse-data:
    name: bk_fintech_clickhouse_data
  prometheus-data:
    name: bk_fintech_prometheus_data
  grafana-data:
    name: bk_fintech_grafana_data
