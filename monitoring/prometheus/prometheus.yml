global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "analytics"
    static_configs:
      - targets: ["analytics:9108"]

  - job_name: "archiver"
    static_configs:
      - targets: ["archiver:9109"]

  - job_name: "kafka-lag"
    static_configs:
      - targets: ["lag-exporter:9110"]
